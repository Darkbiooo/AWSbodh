version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline || npm install

    build:
      commands:
        - |
          # Write environment variables into .env.production for Next.js SSR runtime
          # NOTE: AWS Lambda strictly prohibits variables starting with the reserved prefix "AWS".
          # Therefore, all AWS settings use the "APP_AWS_" prefix in Amplify.
          env | grep -E '^(APP_|app_|aWs_|RESEND_|JWT_|AUTH_|BEDROCK_|NEXT_)' >> .env.production || true

          # Synchronize legacy prefixes and ensure APP_AWS_* variables are always set
          [ -n "$app_aWs_REGION" ] && echo "APP_AWS_REGION=$app_aWs_REGION" >> .env.production || true
          [ -n "$app_aWs_ACCESS_KEY_ID" ] && echo "APP_AWS_ACCESS_KEY_ID=$app_aWs_ACCESS_KEY_ID" >> .env.production || true
          [ -n "$app_aWs_SECRET_ACCESS_KEY" ] && echo "APP_AWS_SECRET_ACCESS_KEY=$app_aWs_SECRET_ACCESS_KEY" >> .env.production || true
          [ -n "$app_aWs_S3_BUCKET" ] && echo "APP_AWS_S3_BUCKET=$app_aWs_S3_BUCKET" >> .env.production || true
          [ -n "$app_aWs_DYNAMODB_TABLE" ] && echo "APP_AWS_DYNAMODB_TABLE=$app_aWs_DYNAMODB_TABLE" >> .env.production || true
          [ -n "$app_aWs_AUTH_TABLE" ] && echo "APP_AWS_AUTH_TABLE=$app_aWs_AUTH_TABLE" >> .env.production || true
          [ -n "$app_aWs_STUDENT_RECORD_TABLE" ] && echo "APP_AWS_STUDENT_RECORD_TABLE=$app_aWs_STUDENT_RECORD_TABLE" >> .env.production || true
          [ -n "$app_BEDROCK_MODEL_ID" ] && echo "BEDROCK_MODEL_ID=$app_BEDROCK_MODEL_ID" >> .env.production || true
          [ -n "$app_AUTH_SECRET" ] && echo "AUTH_SECRET=$app_AUTH_SECRET" >> .env.production || true
          [ -n "$app_JWT_SECRET" ] && echo "JWT_SECRET=$app_JWT_SECRET" >> .env.production || true
          [ -n "$app_RESEND_API_KEY" ] && echo "RESEND_API_KEY=$app_RESEND_API_KEY" >> .env.production || true
          [ -n "$app_RESEND_FROM_EMAIL" ] && echo "RESEND_FROM_EMAIL=$app_RESEND_FROM_EMAIL" >> .env.production || true
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
